name: site-azure-dev

# Manual only. Push does not publish the site.
# Publishes the dev branch to the Ruvio-Dev Static Web App (not production).
# Builds site-next/ (Astro) and uploads the static output to Azure Static Web Apps.
# Azure does not build: the docs are generated from docs/, clients/ and integrations/ in this
# repository, so the build runs here with a pinned Node and Azure only receives site-next/dist.
# Secrets: AZURE_STATIC_WEB_APPS_API_TOKEN_DEV, the deployment token of the Ruvio-Dev app from its
# Overview page ("Manage deployment token").
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-azure-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-next/package-lock.json
      - name: Build
        working-directory: site-next
        run: |
          npm ci
          npm run check
          npm run build
      - name: Mark the dev site noindex
        run: |
          jq '.globalHeaders["X-Robots-Tag"] = "noindex, nofollow"' site-next/dist/staticwebapp.config.json > /tmp/swa.json
          mv /tmp/swa.json site-next/dist/staticwebapp.config.json
      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: site-next/dist
          skip_app_build: true

# Started by hand from the Actions tab only.
