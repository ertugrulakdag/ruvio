# Example host config. Replace requirepass before use.
# Loopback needs no password. A public bind needs requirepass.

address = "127.0.0.1:6379"
shards = 1
metrics_address = "127.0.0.1:9121"

[connections]
max_global = 10000
max_per_ip = 256

[persistence]
profile = "everysec"
data_dir = "/var/lib/ruvio"

[security]
requirepass = "change-me"
protected_mode = true
