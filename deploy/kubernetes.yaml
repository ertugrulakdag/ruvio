# One replica. The process listens only after recovery, so a TCP probe is readiness.
# Set requirepass. The published image defaults to RUVIO_PROTECTED_MODE=false
# and RUVIO_DURABILITY unset (memory). This manifest turns durability on.
apiVersion: v1
kind: Secret
metadata:
  name: ruvio
type: Opaque
stringData:
  RUVIO_REQUIREPASS: change-me
  RUVIO_METRICS_TOKEN: change-me-too
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruvio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruvio
  template:
    metadata:
      labels:
        app: ruvio
    spec:
      containers:
        - name: ruvio
          image: salihcantekin/ruvio:0.2.3
          ports:
            - name: resp
              containerPort: 6379
            - name: metrics
              containerPort: 9121
          env:
            - name: RUVIO_ADDR
              value: 0.0.0.0:6379
            - name: RUVIO_DURABILITY
              value: everysec
            - name: RUVIO_DATA_DIR
              value: /data
            - name: RUVIO_METRICS_ADDR
              value: 0.0.0.0:9121
            - name: RUVIO_REQUIREPASS
              valueFrom:
                secretKeyRef:
                  name: ruvio
                  key: RUVIO_REQUIREPASS
            - name: RUVIO_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ruvio
                  key: RUVIO_METRICS_TOKEN
          readinessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ruvio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ruvio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruvio
spec:
  selector:
    app: ruvio
  ports:
    - name: resp
      port: 6379
      targetPort: resp
    - name: metrics
      port: 9121
      targetPort: metrics
