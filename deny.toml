# Supply-chain policy for Ruvio. CI runs `cargo deny check`.
# See docs/SUPPLY_CHAIN.md.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices, not vulnerabilities, and both reach the build only through
    # iai-callgrind, a dev-dependency used by the instruction-count bench. Neither ships in a
    # released binary. Remove these entries when iai-callgrind drops the crates.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x, dev-dependency only (iai-callgrind)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, dev-dependency only (iai-callgrind-macros)" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
